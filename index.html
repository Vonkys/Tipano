<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>TIPANO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
}
body{
  margin:0;
  background:#0f172a;
  color:#e5e7eb;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.app{
  width:100%;
  max-width:420px;
  padding:1.5rem;
  text-align:center;
}

/* LOGO */
.logo{
  font-size:2.4rem;
  font-weight:800;
  letter-spacing:0.2em;
  color:#38bdf8;
  margin-bottom:2rem;
}

/* BUTTONS */
.menu{
  display:flex;
  flex-direction:column;
  gap:1rem;
}

.menu a{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.75rem;
  padding:1.1rem;
  font-size:1.1rem;
  font-weight:700;
  border-radius:1rem;
  text-decoration:none;
  color:#0b1120;
  background:linear-gradient(135deg,#0ea5e9,#22c55e);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  transition:transform .15s ease, box-shadow .15s ease;
}

.menu a.secondary{
  background:#020617;
  color:#e5e7eb;
  border:1px solid #1f2937;
}

.menu a:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 40px rgba(0,0,0,.45);
}

.icon{
  font-size:1.6rem;
}
</style>
</head>

<body>
<div class="app">

  <div class="logo">TIPANO</div>

  <div class="menu">
    <a href="novy-tiket.html">
      <span class="icon">🎫</span>
      Vsadit
    </a>

    <a href="moje-tikety.html" class="secondary">
      <span class="icon">📋</span>
      Moje tikety
    </a>

    <a href="statistiky.html" class="secondary">
      <span class="icon">📊</span>
      Statistiky
    </a>
  </div>

</div>
</body>
</html>
