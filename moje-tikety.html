<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Tiptano – moje tikety</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{font-family:system-ui;font-size:16px}
body{margin:0;background:#0f172a;color:#e5e7eb;display:flex;justify-content:center}
.app{width:100%;max-width:900px;padding:1rem}

nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.logo{font-weight:700;color:#38bdf8}
.nav-links a{margin-left:.4rem;padding:.35rem .7rem;border-radius:999px;background:#020617;color:#e5e7eb;text-decoration:none;border:1px solid #1f2937;font-size:.8rem}
.nav-links .primary{background:linear-gradient(135deg,#0ea5e9,#22c55e);color:#0b1120;border:none}

.slip{border:1px solid #1f2937;border-radius:.7rem;margin-bottom:.7rem;background:#020617}
.slip-header{padding:.55rem .7rem;display:flex;justify-content:space-between;cursor:pointer;align-items:center}
.slip-body{display:none;padding:.6rem;border-top:1px solid #111827}
.slip-body.open{display:block}

.status-pill{font-size:.7rem;padding:.2rem .55rem;border-radius:999px;border:1px solid #374151}
.status-pending{background:rgba(55,65,81,.6)}
.status-won{background:rgba(22,163,74,.25);border-color:#22c55e}
.status-lost{background:rgba(220,38,38,.25);border-color:#f97373}

.match{border:1px solid #1f2937;border-radius:.5rem;padding:.45rem;margin-bottom:.45rem;font-size:.8rem}
.match.won{border-color:#22c55e;background:rgba(22,163,74,.08)}
.match.lost{border-color:#f97373;background:rgba(220,38,38,.06)}

input{
  background:#020617;color:#e5e7eb;border:1px solid #374151;
  border-radius:.4rem;padding:.25rem;text-align:center;width:3rem
}
.btn{
  background:linear-gradient(135deg,#0ea5e9,#22c55e);
  border:none;border-radius:999px;padding:.25rem .6rem;
  font-weight:600;color:#0b1120;cursor:pointer;font-size:.75rem;margin-left:.3rem
}
.small{font-size:.75rem;color:#9ca3af}
.summary{margin-top:.6rem;padding-top:.6rem;border-top:1px dashed #334155}
</style>
</head>

<body>
<div class="app">

<nav>
  <div class="logo">TIPTANO</div>
  <div class="nav-links">
    <a href="index.html">Domů</a>
    <a href="novy-tiket.html">Nový tiket</a>
    <a class="primary" href="moje-tikety.html">Moje tikety</a>
    <a href="statistiky.html">Statistiky</a>
  </div>
</nav>

<h1>Moje tikety</h1>
<div id="slips"></div>

</div>

<script>
const STORAGE_KEY='tiptano-data-v1';
let data={slips:[],wallet:{deposited:0}};

function loadData(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const p=JSON.parse(raw);
      if(p.slips)data.slips=p.slips;
      if(p.wallet)data.wallet=p.wallet;
    }catch(e){}
  }
}
function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function normalize(s){
  return (s||'').toLowerCase().replace(/\s+/g,' ').trim();
}

function getTotalOdds(slip){
  return slip.matches.reduce((a,m)=>a*(Number(m.odds)||1),1);
}
function formatTip(m){
  if(!m.tipCode) return '—';

  switch(m.tipCode){
    case '1':  return m.home;
    case '2':  return m.away;
    case 'X':  return 'Remíza';
    case '1X': return m.home + ' nebo remíza';
    case 'X2': return m.away + ' nebo remíza';
    default:   return m.tipCode;
  }
}
/* ===== VYHODNOCENÍ JEDNOHO ZÁPASU ===== */
function evaluateMatch(m){
  const h = Number(m.resultHome);
  const a = Number(m.resultAway);
  if(isNaN(h) || isNaN(a)){
    m.status = 'pending';
    return;
  }

  let outcome; // 1 / 2 / X
  if(h > a) outcome = '1';
  else if(h < a) outcome = '2';
  else outcome = 'X';

  const t = m.tipCode || '1'; // fallback

  if(
    t === outcome ||
    (t === '1X' && (outcome === '1' || outcome === 'X')) ||
    (t === 'X2' && (outcome === '2' || outcome === 'X'))
  ){
    m.status = 'won';
  } else {
    m.status = 'lost';
  }
}

/* ===== RENDER ===== */
function render(){
  const box=document.getElementById('slips');
  if(!data.slips.length){
    box.innerHTML='<div class="small">Zatím žádný tiket.</div>';
    return;
  }

  const slipsSorted=[...data.slips].sort((a,b)=>{
    return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
  });

  box.innerHTML=slipsSorted.map(slip=>{
    let won=0,lost=0,pending=0;
    slip.matches.forEach(m=>{
      if(m.status==='won')won++;
      else if(m.status==='lost')lost++;
      else pending++;
    });

    const pill = lost>0 ? 'status-lost' : pending>0 ? 'status-pending' : 'status-won';
    const pillText = lost>0 ? 'prohraný' : pending>0 ? 'rozběhnuto' : 'vyhraný';
    const totalOdds=getTotalOdds(slip);
    const potential=(slip.stake||0)*totalOdds;

    return `
    <div class="slip">
      <div class="slip-header">
  <div onclick="this.parentElement.nextElementSibling.classList.toggle('open')" style="flex:1;cursor:pointer">
    <strong>${new Date(slip.createdAt).toLocaleString()}</strong>
    <div class="small">Zápasy: ${slip.matches.length} • OK ${won} / KO ${lost}</div>
  </div>
  <span class="status-pill ${pill}">${pillText}</span>
  <button class="btn" onclick="deleteSlip(${slip.id})">🗑</button>
</div>
        <div>
          <strong>${new Date(slip.createdAt).toLocaleString()}</strong>
          <div class="small">Zápasy: ${slip.matches.length} • OK ${won} / KO ${lost}</div>
        </div>
        <span class="status-pill ${pill}">${pillText}</span>
      </div>

      <div class="slip-body ${pending>0?'open':''}">
        ${slip.matches.map((m,mi)=>`
          <div class="match ${m.status||'pending'}">
            <div><strong>${m.home}</strong> – <strong>${m.away}</strong></div>
            <div class="small">
            Tip: ${formatTip(m)} (${m.tipCode}) • Kurz: ${m.odds}
            </div>
            <div style="margin:.35rem 0">
              Výsledek:
              <input id="h-${slip.id}-${mi}" type="number" value="${m.resultHome??''}">
              :
              <input id="a-${slip.id}-${mi}" type="number" value="${m.resultAway??''}">
              <button class="btn" onclick="confirmScore(${slip.id},${mi})">✓</button>
            </div>

            <div class="small">Stav: ${m.status==='won'?'OK':m.status==='lost'?'KO':'čeká'}</div>
          </div>
        `).join('')}

        <div class="summary">
          <div class="small">Celkový kurz: <strong>${totalOdds.toFixed(2)}</strong></div>
          <div class="small">Vklad: <strong>${slip.stake} Kč</strong></div>
          <div class="small">Možná výhra: <strong>${potential.toFixed(2)} Kč</strong></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ===== POTVRZENÍ SKÓRE (ID, NE INDEX) ===== */
function confirmScore(slipId,matchIndex){
  const slip=data.slips.find(s=>s.id===slipId);
  if(!slip) return;

  const m=slip.matches[matchIndex];
  if(!m) return;

  const h=document.getElementById(`h-${slipId}-${matchIndex}`).value;
  const a=document.getElementById(`a-${slipId}-${matchIndex}`).value;
  if(h===''||a==='') return alert('Zadej oba výsledky');

  m.resultHome=h;
  m.resultAway=a;

  evaluateMatch(m);
  saveData();
  render();
}
function deleteSlip(slipId){
  if(!confirm('Opravdu chceš smazat celý tiket?')) return;

  data.slips = data.slips.filter(s => s.id !== slipId);
  saveData();
  render();
}

loadData();
render();
</script>
</body>
</html>
