<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Tiptano – moje tikety</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;color-scheme:light dark;}
    body{margin:0;padding:0;background:#0f172a;color:#e5e7eb;display:flex;justify-content:center;}
    .app{width:100%;max-width:900px;padding:1rem;box-sizing:border-box;}
    nav{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;margin-bottom:1rem;}
    .logo{font-weight:700;letter-spacing:0.08em;text-transform:uppercase;font-size:0.9rem;color:#38bdf8;}
    .nav-links{display:flex;gap:0.5rem;flex-wrap:wrap;}
    .nav-link{font-size:0.8rem;padding:0.35rem 0.7rem;border-radius:999px;border:1px solid #1f2937;text-decoration:none;color:#e5e7eb;background:#020617;}
    .nav-link.primary{background:linear-gradient(135deg,#0ea5e9,#22c55e);color:#0b1120;border:none;}
    h1{font-size:1.3rem;margin:0 0 0.3rem;}
    .subtitle{font-size:0.85rem;color:#9ca3af;margin-bottom:0.8rem;}
    .card{background:#020617;border-radius:0.75rem;padding:0.8rem 0.9rem;margin-bottom:0.9rem;box-shadow:0 8px 24px rgba(0,0,0,0.35);border:1px solid #1f2937;}
    .slip-list{margin-top:0.3rem;}
    .slip-list-empty{font-size:0.85rem;color:#6b7280;text-align:center;margin-top:0.5rem;}
    .slip{margin-bottom:0.6rem;border-radius:0.75rem;overflow:hidden;border:1px solid #1f2937;background:#020617;}
    .slip-header{display:flex;justify-content:space-between;align-items:center;padding:0.55rem 0.7rem;cursor:pointer;gap:0.5rem;}
    .slip-header-main{display:flex;flex-direction:column;gap:0.15rem;}
    .slip-title-row{display:flex;gap:0.4rem;align-items:baseline;flex-wrap:wrap;}
    .slip-date{font-weight:600;font-size:0.9rem;}
    .slip-name{font-size:0.85rem;color:#9ca3af;}
    .slip-stats{font-size:0.75rem;color:#9ca3af;}
    .slip-status-pill{font-size:0.75rem;padding:0.2rem 0.55rem;border-radius:999px;border:1px solid #374151;text-transform:uppercase;letter-spacing:0.05em;}
    .slip-status-won{background:rgba(22,163,74,0.2);border-color:#22c55e;color:#bbf7d0;}
    .slip-status-lost{background:rgba(220,38,38,0.18);border-color:#f97373;color:#fecaca;}
    .slip-status-pending{background:rgba(55,65,81,0.6);border-color:#6b7280;color:#e5e7eb;}
    .slip-body{padding:0.5rem 0.7rem 0.65rem;border-top:1px solid #111827;display:none;}
    .slip-body.open{display:block;}
    label{font-size:0.8rem;display:block;margin-bottom:0.2rem;color:#9ca3af;}
    input,button{border-radius:0.5rem;border:1px solid #374151;padding:0.45rem 0.55rem;font-size:0.9rem;box-sizing:border-box;background:#020617;color:#e5e7eb;}
    input:focus{outline:2px solid #38bdf8;outline-offset:1px;border-color:#38bdf8;}
    input[type="number"]{text-align:center;}
    .field-row{display:flex;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap;}
    .field{flex:1 1 100%;}
    .field.small{flex:0 0 4rem;}
    .field.medium{flex:0 0 5.5rem;}
    .btn{border-radius:999px;border:none;padding:0.5rem 0.9rem;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#0ea5e9,#22c55e);color:#0b1120;display:inline-flex;align-items:center;justify-content:center;gap:0.35rem;white-space:nowrap;}
    .btn.secondary{background:transparent;border:1px solid #4b5563;color:#e5e7eb;}
    .btn.small{padding:0.35rem 0.65rem;font-size:0.8rem;}
    .btn:active{transform:translateY(1px);}
    .matches{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.5rem;}
    .match-row{border-radius:0.6rem;padding:0.4rem 0.45rem;border:1px solid #1f2937;background:#020617;display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1.1fr) auto;grid-template-rows:auto auto;column-gap:0.35rem;row-gap:0.25rem;align-items:center;font-size:0.8rem;}
    .match-main{grid-column:1/span 2;display:flex;flex-direction:column;gap:0.15rem;}
    .teams{font-weight:500;}
    .tip-text{font-size:0.8rem;color:#9ca3af;}
    .match-result-inputs{grid-column:1/span 2;display:flex;align-items:center;gap:0.25rem;flex-wrap:wrap;}
    .match-result-inputs span.x{font-size:0.8rem;color:#9ca3af;}
    .match-actions{grid-row:1/span 2;grid-column:3;display:flex;flex-direction:column;gap:0.25rem;align-items:flex-end;justify-content:center;}
    .match-status-label{font-size:0.7rem;padding:0.18rem 0.5rem;border-radius:999px;border:1px solid #374151;}
    .match-pending{background:rgba(55,65,81,0.5);}
    .match-won{background:rgba(22,163,74,0.2);border-color:#22c55e;}
    .match-lost{background:rgba(220,38,38,0.18);border-color:#f97373;}
    .match-row.won{border-color:#22c55e;background:rgba(22,163,74,0.08);}
    .match-row.lost{border-color:#f97373;background:rgba(220,38,38,0.05);}
    .match-row.pending{border-color:#1f2937;}
    .no-matches{font-size:0.8rem;color:#6b7280;margin-bottom:0.4rem;}
    .slip-summary{font-size:0.8rem;margin-bottom:0.4rem;border-radius:0.6rem;padding:0.4rem 0.5rem;border:1px dashed #1f2937;background:#020617;display:flex;flex-direction:column;gap:0.2rem;}
    .top-info{font-size:0.85rem;color:#9ca3af;margin-bottom:0.5rem;}
    @media(min-width:600px){
      .field{flex:1 1 0;}
      .field.small{flex:0 0 4rem;}
      .field.medium{flex:0 0 5rem;}
    }
  </style>
</head>
<body>
  <div class="app">
    <nav>
      <div class="logo">TIPTANO</div>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Domů</a>
        <a class="nav-link" href="novy-tiket.html">Nový tiket</a>
        <a class="nav-link primary" href="moje-tikety.html">Moje tikety</a>
        <a class="nav-link" href="statistiky.html">Statistiky</a>
      </div>
    </nav>

    <h1>Moje tikety</h1>
    <div class="subtitle">Vyplň výsledky a sleduj, jak na tom jsi.</div>

    <div class="card">
      <div class="top-info" id="overall-info"></div>
      <div class="slip-list" id="slips-container">
        <div class="slip-list-empty">Zatím žádný tiket.</div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY='tiptano-data-v1';
    let data={slips:[],wallet:{deposited:0}};

    function loadData(){
      try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(!raw)return;
        const parsed=JSON.parse(raw);
        if(parsed.slips)data.slips=parsed.slips;
        if(parsed.wallet)data.wallet=parsed.wallet;
        if(typeof data.wallet.deposited!=='number')data.wallet.deposited=0;
      }catch(e){}
    }
    function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}
    function pad(n){return String(n).padStart(2,'0');}
    function fmtDate(s){if(!s)return'';const [y,m,d]=s.split('-');return`${d}.${m}.${y}`;}
    function fmtOdds(o){if(!o)return'-';const r=Math.round(o*100)/100;return r.toFixed(2);}
    function fmtMoney(v){if(!v)return'0 Kč';const sign=v<0?'-':'';const abs=Math.abs(v);const r=Math.round(abs*100)/100;const parts=r.toFixed(2).split('.');if(parts[1]==='00')return sign+parts[0]+' Kč';return sign+parts[0]+','+parts[1]+' Kč';}

    function getSlipStats(slip){
      const total=slip.matches.length;
      let won=0,lost=0,pending=0;
      slip.matches.forEach(m=>{
        if(m.status==='won')won++;
        else if(m.status==='lost')lost++;
        else pending++;
      });
      let status='pending';
      if(total>0){
        if(lost>0)status='lost';
        else if(pending>0)status='pending';
        else status='won';
      }
      return{total,won,lost,pending,status};
    }
    function getSlipOdds(slip){
      if(!slip.matches.length)return 0;
      return slip.matches.reduce((acc,m)=>acc*(m.odds||1),1);
    }
    function calcGlobal(){
      let wonTips=0,lostTips=0,totalPL=0,totalStake=0;
      data.slips.forEach(slip=>{
        const stats=getSlipStats(slip);
        const stake=Number(slip.stake)||0;
        const totalOdds=getSlipOdds(slip);
        totalStake+=stake;
        slip.matches.forEach(m=>{
          if(m.status==='won')wonTips++; else if(m.status==='lost')lostTips++;
        });
        if(stake>0&&totalOdds>0){
          if(stats.status==='won')totalPL+=stake*totalOdds-stake;
          else if(stats.status==='lost')totalPL-=stake;
        }
      });
      const decided=wonTips+lostTips;
      const rate=decided?(wonTips/decided*100):0;
      return{wonTips,lostTips,decided,rate,totalPL,totalStake};
    }
    function evaluateMatch(match){
      if(match.resultHome===''||match.resultAway===''||match.resultHome==null||match.resultAway==null){
        match.status='pending';return;
      }
      const h=parseInt(match.resultHome,10);
      const a=parseInt(match.resultAway,10);
      if(isNaN(h)||isNaN(a)){match.status='pending';return;}
      let real;
      if(h>a)real='1';else if(h<a)real='2';else real='0';
      const tipStr=(match.tip||'').toString();
      match.status=tipStr.includes(real)?'won':'lost';
    }

    function renderOverall(){
      const o=calcGlobal();
      const el=document.getElementById('overall-info');
      if(!data.slips.length){
        el.textContent='Zatím žádný tiket uložen.';
        return;
      }
      el.textContent=`Tiketů: ${data.slips.length} • Tipů vyhodnoceno: ${o.decided} • Úspěšnost: ${o.decided?o.rate.toFixed(1)+' %':'—'} • Celkově: ${fmtMoney(o.totalPL)}`;
    }

    function renderSlips(){
      const container=document.getElementById('slips-container');
      if(!data.slips.length){
        container.innerHTML='<div class="slip-list-empty">Zatím žádný tiket.</div>';
        renderOverall();
        return;
      }
      const sorted=[...data.slips].sort((a,b)=>{
        if(a.date===b.date)return(a.createdAt||'').localeCompare(b.createdAt||'');
        return a.date.localeCompare(b.date);
      });

      container.innerHTML=sorted.map(slip=>{
        const stats=getSlipStats(slip);
        const totalOdds=getSlipOdds(slip);
        const stake=Number(slip.stake)||0;
        let slipPL=0;
        if(stake>0&&totalOdds>0){
          if(stats.status==='won')slipPL=stake*totalOdds-stake;
          else if(stats.status==='lost')slipPL=-stake;
        }
        let statusClass='slip-status-pending',statusText='rozběhnuto';
        if(stats.status==='won'){statusClass='slip-status-won';statusText='vyhraný';}
        if(stats.status==='lost'){statusClass='slip-status-lost';statusText='prohraný';}

        const matchesHtml=slip.matches.length?slip.matches.map(m=>{
          const rowClass=m.status==='won'?'won':m.status==='lost'?'lost':'pending';
          let label='čeká',cls='match-pending';
          if(m.status==='won'){label='OK';cls='match-won';}
          if(m.status==='lost'){label='KO';cls='match-lost';}
          const resHomeId=`res-home-${slip.id}-${m.id}`;
          const resAwayId=`res-away-${slip.id}-${m.id}`;
          return`
            <div class="match-row ${rowClass}" data-slip-id="${slip.id}" data-match-id="${m.id}">
              <div class="match-main">
                <div class="teams">${m.home} – ${m.away}</div>
                <div class="tip-text">Tip: <strong>${m.tip}</strong> • Kurz: <strong>${fmtOdds(m.odds)}</strong></div>
              </div>
              <div class="match-result-inputs">
                <span>Výsledek:</span>
                <input type="number" min="0" id="${resHomeId}" value="${m.resultHome??''}" placeholder="0" style="width:3.2rem;">
                <span class="x">:</span>
                <input type="number" min="0" id="${resAwayId}" value="${m.resultAway??''}" placeholder="0" style="width:3.2rem;">
              </div>
              <div class="match-actions">
                <button class="btn small" type="button" data-action="update-result" data-slip-id="${slip.id}" data-match-id="${m.id}">✓</button>
                <button class="btn small secondary" type="button" data-action="delete-match" data-slip-id="${slip.id}" data-match-id="${m.id}">🗑</button>
                <div class="match-status-label ${cls}">${label}</div>
              </div>
            </div>
          `;
        }).join(''):'<div class="no-matches">Na tiketu nejsou žádné zápasy.</div>';

        const stakeInputId=`stake-${slip.id}`;

        return`
          <div class="slip" data-slip-id="${slip.id}">
            <div class="slip-header" data-action="toggle-slip" data-slip-id="${slip.id}">
              <div class="slip-header-main">
                <div class="slip-title-row">
                  <span class="slip-date">${fmtDate(slip.date)}</span>
                  ${slip.name?`<span class="slip-name">${slip.name}</span>`:''}
                </div>
                <div class="slip-stats">
                  Zápasy: ${stats.total} • OK: ${stats.won} • KO: ${stats.lost} • čeká: ${stats.pending}
                </div>
              </div>
              <div class="slip-status-pill ${statusClass}">${statusText}</div>
            </div>
            <div class="slip-body" data-body-for="${slip.id}">
              <div class="slip-summary">
                <div>Celkový kurz: <strong>${totalOdds?fmtOdds(totalOdds):'-'}</strong></div>
                <div class="field-row" style="margin-top:0.25rem;">
                  <div class="field.medium">
                    <label for="${stakeInputId}">Sázka</label>
                    <input type="number" id="${stakeInputId}" min="0" step="1" value="${stake||''}">
                  </div>
                  <div class="field">
                    <label>&nbsp;</label>
                    <button class="btn small secondary" type="button" data-action="update-stake" data-slip-id="${slip.id}">💾 Uložit sázku</button>
                  </div>
                  <div class="field">
                    <label>&nbsp;</label>
                    <button class="btn small secondary" type="button" data-action="delete-slip" data-slip-id="${slip.id}">🗑 Smazat tiket</button>
                  </div>
                </div>
                <div>Možná výhra: <strong>${stake>0&&totalOdds>0?fmtMoney(stake*totalOdds):'—'}</strong></div>
                <div>Výsledek tiketu: <strong>${slipPL?fmtMoney(slipPL):(stats.status==='pending'?'zatím 0 Kč (čeká)':'0 Kč')}</strong></div>
              </div>
              <div class="matches">${matchesHtml}</div>
            </div>
          </div>
        `;
      }).join('');
      renderOverall();
    }

    document.getElementById('slips-container').addEventListener('click',e=>{
      const header=e.target.closest('.slip-header');
      if(header&&header.dataset.action==='toggle-slip'){
        const id=header.dataset.slipId;
        const body=document.querySelector(`.slip-body[data-body-for="${id}"]`);
        if(body)body.classList.toggle('open');
        return;
      }
      const btn=e.target.closest('button');
      if(!btn)return;
      const action=btn.dataset.action;
      if(!action)return;

      if(action==='update-result'){
        const slipId=btn.dataset.slipId;
        const matchId=btn.dataset.matchId;
        const slip=data.slips.find(s=>s.id===slipId);
        if(!slip)return;
        const m=slip.matches.find(x=>x.id===matchId);
        if(!m)return;
        const resHome=document.getElementById(`res-home-${slipId}-${matchId}`);
        const resAway=document.getElementById(`res-away-${slipId}-${matchId}`);
        m.resultHome=resHome.value.trim();
        m.resultAway=resAway.value.trim();
        evaluateMatch(m);
        saveData();
        renderSlips();
      }

      if(action==='update-stake'){
        const slipId=btn.dataset.slipId;
        const slip=data.slips.find(s=>s.id===slipId);
        if(!slip)return;
        const inp=document.getElementById(`stake-${slipId}`);
        const val=parseFloat((inp.value||'').toString().replace(',','.'))||0;
        slip.stake=val<0?0:val;
        saveData();
        renderSlips();
      }

      if(action==='delete-slip'){
        const slipId=btn.dataset.slipId;
        if(!confirm('Smazat tento tiket včetně všech zápasů?'))return;
        data.slips=data.slips.filter(s=>s.id!==slipId);
        saveData();
        renderSlips();
      }

      if(action==='delete-match'){
        const slipId=btn.dataset.slipId;
        const matchId=btn.dataset.matchId;
        const slip=data.slips.find(s=>s.id===slipId);
        if(!slip)return;
        slip.matches=slip.matches.filter(m=>m.id!==matchId);
        saveData();
        renderSlips();
      }
    });

    (function init(){
      loadData();
      renderSlips();
    })();
  </script>
</body>
</html>
