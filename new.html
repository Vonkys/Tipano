<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Tiptano – Nový tiket</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
  background:#0f172a;
  color:#e5e7eb;
  font-family:system-ui;
  margin:0;
  display:flex;
  justify-content:center;
}
.app{width:100%;max-width:900px;padding:1rem}

/* NAV */
nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.logo{font-weight:700;letter-spacing:.08em;color:#38bdf8}
.nav-links a{
  margin-left:.4rem;padding:.35rem .7rem;border-radius:999px;
  background:#020617;color:#e5e7eb;text-decoration:none;
  border:1px solid #1f2937;font-size:.8rem
}
.nav-links .primary{
  background:linear-gradient(135deg,#0ea5e9,#22c55e);
  color:#0b1120;border:none
}

/* CARD */
.card{
  background:#020617;border-radius:14px;padding:16px;
  margin-bottom:16px;box-shadow:0 10px 25px rgba(0,0,0,.35)
}
button{
  background:#22c55e;color:#000;border:none;
  padding:12px 18px;border-radius:10px;
  font-weight:700;cursor:pointer
}
input{
  background:#020617;border:1px solid #334155;
  color:#e5e7eb;padding:10px;border-radius:8px;width:100%
}
.match{border-bottom:1px solid #334155;padding:10px 0}
.small{color:#9ca3af;font-size:13px}

/* TIP BUTTONS */
.tip-buttons{display:flex;gap:.4rem;margin:.4rem 0;flex-wrap:wrap}
.tip-btn{
  padding:.3rem .6rem;
  border-radius:999px;
  border:1px solid #374151;
  background:#020617;
  color:#e5e7eb;
  font-size:.75rem;
  cursor:pointer
}
.tip-btn.active{
  background:linear-gradient(135deg,#0ea5e9,#22c55e);
  color:#0b1120;
  border:none
}

/* OCR overlay */
#ocr-loading{
  position:fixed;inset:0;
  background:rgba(2,6,23,.8);
  display:none;justify-content:center;align-items:center;z-index:999
}
.loader{
  background:#020617;border:1px solid #1f2937;
  border-radius:16px;padding:24px 28px;text-align:center
}
.spinner{
  width:46px;height:46px;
  border:4px solid #1f2937;
  border-top-color:#22c55e;
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>
<div class="app">

<nav>
  <div class="logo">TIPTANO</div>
  <div class="nav-links">
    <a href="index.html">Domů</a>
    <a class="primary" href="novy-tiket.html">Nový tiket</a>
    <a href="moje-tikety.html">Moje tikety</a>
    <a href="statistiky.html">Statistiky</a>
  </div>
</nav>

<h2>📸 Nový tiket ze screenu</h2>

<div class="card">
  <input type="file" id="img" accept="image/*">
  <br><br>
  <button onclick="runOCR()">Načíst screenshot</button>
</div>

<div class="card" id="preview" style="display:none">
  <h3>📋 Načtené zápasy</h3>
  <div id="matches"></div>

  <p class="small">
    Celkový kurz: <strong id="totalOdds">—</strong>
  </p>

  <label>Sázka</label>
  <input type="number" id="stake" value="100">

  <br><br>
  <button onclick="saveSlip()">Vsadit (uložit tiket)</button>
  <div class="small" id="msg"></div>
</div>

</div>

<!-- OCR LOADING -->
<div id="ocr-loading">
  <div class="loader">
    <div class="spinner"></div>
    <div class="small" id="loader-text">Načítám obrázek…</div>
  </div>
</div>

<script>
const STORAGE_KEY='tiptano-data-v1';
let data={slips:[],wallet:{deposited:0}};
let parsedMatches=[];

function loadData(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(raw){
    const p=JSON.parse(raw);
    if(p.slips)data.slips=p.slips;
    if(p.wallet)data.wallet=p.wallet;
  }
}
function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}
loadData();

/* OCR */
async function runOCR(){
  const file=document.getElementById("img").files[0];
  if(!file)return alert("Vyber obrázek");

  const overlay=document.getElementById("ocr-loading");
  const txt=document.getElementById("loader-text");
  overlay.style.display="flex";
  txt.textContent="Rozpoznávám text…";

  try{
    const res=await Tesseract.recognize(file,"ces+eng");
    parseOCR(res.data.text);
  }finally{
    overlay.style.display="none";
  }
}

/* PARSER – JEN ZÁPASY + KURZ */
function parseOCR(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  parsedMatches=[];

  for(let i=0;i<lines.length;i++){
    if(lines[i].includes(' - ')){
      const [home, ...rest]=lines[i].split(' - ');
      const away=rest.join(' - ');
      for(let j=i+1;j<i+5 && j<lines.length;j++){
        const m=lines[j].match(/(\d+\.\d{2})/);
        if(m){
          parsedMatches.push({
            home,away,
            odds:parseFloat(m[1]),
            tipCode:null
          });
          break;
        }
      }
    }
  }
  renderPreview();
}

/* PREVIEW */
function renderPreview(){
  const box=document.getElementById("matches");
  let total=1;
  box.innerHTML="";

  parsedMatches.forEach((m,i)=>{
    total*=m.odds;
    box.innerHTML+=`
      <div class="match">
        <strong>${m.home} – ${m.away}</strong><br>
        Kurz: ${m.odds}
        <div class="tip-buttons">
          ${['1','X','2','1X','X2'].map(t=>`
            <button class="tip-btn ${m.tipCode===t?'active':''}"
              onclick="setTip(${i},'${t}')">${t}</button>
          `).join('')}
        </div>
      </div>
    `;
  });

  document.getElementById("totalOdds").textContent=total.toFixed(2);
  document.getElementById("preview").style.display=
    parsedMatches.length?"block":"none";
}

function setTip(i,tip){
  parsedMatches[i].tipCode=tip;
  renderPreview();
}

/* VSADIT */
function saveSlip(){
  const stake=Number(document.getElementById("stake").value);
  const msg=document.getElementById("msg");

  if(parsedMatches.some(m=>!m.tipCode))
    return msg.textContent="Vyber tip u všech zápasů.";

  if(stake<=0) return msg.textContent="Zadej sázku.";
  if(stake>data.wallet.deposited)
    return msg.textContent="Nemáš dost peněz.";

  data.slips.push({
    id:Date.now(),
    createdAt:new Date().toISOString(),
    stake,
    matches:parsedMatches
  });

  saveData();
  msg.textContent="✅ Tiket uložen";
}
</script>

</body>
</html>
