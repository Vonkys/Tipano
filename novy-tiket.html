<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Tiptano – nový tiket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:16px;
      color-scheme:light dark;
    }
    body{
      margin:0;
      padding:0;
      background:#0f172a;
      color:#e5e7eb;
      display:flex;
      justify-content:center;
    }
    .app{
      width:100%;
      max-width:900px;
      padding:1rem;
      box-sizing:border-box;
    }
    nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:0.75rem;
      margin-bottom:1rem;
    }
    .logo{
      font-weight:700;
      letter-spacing:0.08em;
      text-transform:uppercase;
      font-size:0.9rem;
      color:#38bdf8;
    }
    .nav-links{
      display:flex;
      gap:0.5rem;
      flex-wrap:wrap;
    }
    .nav-link{
      font-size:0.8rem;
      padding:0.35rem 0.7rem;
      border-radius:999px;
      border:1px solid #1f2937;
      text-decoration:none;
      color:#e5e7eb;
      background:#020617;
    }
    .nav-link.primary{
      background:linear-gradient(135deg,#0ea5e9,#22c55e);
      color:#0b1120;
      border:none;
    }
    h1{
      font-size:1.3rem;
      margin:0 0 0.3rem;
    }
    .subtitle{
      font-size:0.85rem;
      color:#9ca3af;
      margin-bottom:0.8rem;
    }
    .card{
      background:#020617;
      border-radius:0.75rem;
      padding:0.8rem 0.9rem;
      margin-bottom:0.9rem;
      box-shadow:0 8px 24px rgba(0,0,0,0.35);
      border:1px solid #1f2937;
    }
    label{
      font-size:0.8rem;
      display:block;
      margin-bottom:0.2rem;
      color:#9ca3af;
    }
    input,button{
      border-radius:0.5rem;
      border:1px solid #374151;
      padding:0.45rem 0.55rem;
      font-size:0.9rem;
      box-sizing:border-box;
      background:#020617;
      color:#e5e7eb;
    }
    input:focus{
      outline:2px solid #38bdf8;
      outline-offset:1px;
      border-color:#38bdf8;
    }
    input[type="number"]{
      text-align:center;
    }
    .field-row{
      display:flex;
      gap:0.5rem;
      margin-bottom:0.5rem;
      flex-wrap:wrap;
    }
    .field{
      flex:1 1 100%;
    }
    .field.small{
      flex:0 0 4rem;
    }
    .field.medium{
      flex:0 0 5.5rem;
    }
    .btn{
      border-radius:999px;
      border:none;
      padding:0.5rem 0.9rem;
      font-weight:600;
      cursor:pointer;
      background:linear-gradient(135deg,#0ea5e9,#22c55e);
      color:#0b1120;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:0.35rem;
      white-space:nowrap;
    }
    .btn.secondary{
      background:transparent;
      border:1px solid #4b5563;
      color:#e5e7eb;
    }
    .btn.small{
      padding:0.35rem 0.65rem;
      font-size:0.8rem;
    }
    .btn:active{
      transform:translateY(1px);
    }
    .matches{
      display:flex;
      flex-direction:column;
      gap:0.4rem;
      margin:0.4rem 0;
    }
    .match-row{
      border-radius:0.6rem;
      padding:0.4rem 0.5rem;
      border:1px solid #1f2937;
      background:#020617;
      display:flex;
      justify-content:space-between;
      gap:0.4rem;
      font-size:0.8rem;
      align-items:center;
    }
    .match-main{
      display:flex;
      flex-direction:column;
      gap:0.15rem;
    }
    .teams{
      font-weight:500;
    }
    .tip-info{
      font-size:0.8rem;
      color:#9ca3af;
    }
    .match-actions{
      display:flex;
      flex-direction:column;
      gap:0.25rem;
      align-items:flex-end;
    }
    .summary{
      font-size:0.9rem;
      margin-top:0.4rem;
      color:#e5e7eb;
    }
    .summary span{
      font-weight:600;
    }
    .msg{
      font-size:0.8rem;
      margin-top:0.4rem;
    }
    .msg.ok{color:#22c55e;}
    .msg.err{color:#f97373;}
    @media(min-width:600px){
      .field{flex:1 1 0;}
      .field.small{flex:0 0 4rem;}
      .field.medium{flex:0 0 5rem;}
    }
  </style>
</head>
<body>
  <div class="app">
    <nav>
      <div class="logo">TIPTANO</div>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Domů</a>
        <a class="nav-link primary" href="novy-tiket.html">Nový tiket</a>
        <a class="nav-link" href="moje-tikety.html">Moje tikety</a>
        <a class="nav-link" href="statistiky.html">Statistiky</a>
      </div>
    </nav>

    <h1>Nový tiket</h1>
    <div class="subtitle">Nejdřív přidávej zápasy, pak nastav sázku. Bez dobití peněženky nevsadíš nic.</div>

    <div class="card">
      <h2 style="font-size:0.95rem;margin:0 0 0.4rem;">Přidat zápas</h2>
      <div class="field-row">
        <div class="field">
          <label for="home">Domácí</label>
          <input type="text" id="home" placeholder="Slavia">
        </div>
        <div class="field">
          <label for="away">Hosté</label>
          <input type="text" id="away" placeholder="Sparta">
        </div>
      </div>
      <div class="field-row">
        <div class="field.medium">
          <label for="tip">Tip</label>
          <input type="text" id="tip" placeholder="1, 0, 2, 01, 02…">
        </div>
        <div class="field.small">
          <label for="odds">Kurz</label>
          <input type="number" id="odds" step="0.01" min="1" placeholder="1.85">
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn small" id="add-match">➕ Přidat zápas</button>
        </div>
      </div>

      <div id="matches-block">
        <!-- sem se kreslí aktuální zápasy -->
      </div>

      <hr style="border:none;border-top:1px dashed #1f2937;margin:0.6rem 0;">

      <h2 style="font-size:0.95rem;margin:0 0 0.4rem;">Nastavení tiketu</h2>
      <div class="field-row">
        <div class="field">
          <label for="date">Datum</label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label for="name">Název / poznámka</label>
          <input type="text" id="name" placeholder="např. Liga mistrů AKO">
        </div>
      </div>
      <div class="field-row">
        <div class="field.medium">
          <label for="stake">Sázka</label>
          <input type="number" id="stake" min="0" step="1" placeholder="100">
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn" id="save-slip">💾 Uložit tiket</button>
        </div>
      </div>

      <div class="summary" id="summary">
        Zatím žádný zápas.
      </div>
      <div class="msg" id="message"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'tiptano-data-v1';
    let data = { slips: [], wallet: { deposited: 0 } };
    let currentMatches = [];

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.slips)) data.slips = parsed.slips;
        if (parsed.wallet) data.wallet = parsed.wallet;
        if (typeof data.wallet.deposited !== 'number') data.wallet.deposited = 0;
      } catch (e) {}
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function pad(n){return String(n).padStart(2,'0');}

    function fmtOdds(o){
      if(!o) return '-';
      const r=Math.round(o*100)/100;
      return r.toFixed(2);
    }

    function getCurrentTotalOdds(){
      if(!currentMatches.length) return 0;
      return currentMatches.reduce((acc,m)=>acc*(m.odds||1),1);
    }

    function fmtMoney(v){
      if(!v) return '0 Kč';
      const sign=v<0?'-':'';
      const abs=Math.abs(v);
      const r=Math.round(abs*100)/100;
      const parts=r.toFixed(2).split('.');
      if(parts[1]==='00')return sign+parts[0]+' Kč';
      return sign+parts[0]+','+parts[1]+' Kč';
    }

    function renderMatches(){
      const block=document.getElementById('matches-block');
      const summary=document.getElementById('summary');
      if(!currentMatches.length){
        block.innerHTML='<div style="font-size:0.8rem;color:#6b7280;margin-top:0.3rem;">Na tiketu zatím nic není.</div>';
        summary.textContent='Zatím žádný zápas.';
        return;
      }
      block.innerHTML = `
        <div class="matches">
          ${currentMatches.map(m=>`
            <div class="match-row" data-id="${m.id}">
              <div class="match-main">
                <div class="teams">${m.home} – ${m.away}</div>
                <div class="tip-info">Tip: <strong>${m.tip}</strong> • Kurz: <strong>${fmtOdds(m.odds)}</strong></div>
              </div>
              <div class="match-actions">
                <button class="btn small secondary" data-action="delete-match" data-id="${m.id}">🗑</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
      const totalOdds=getCurrentTotalOdds();
      const stakeVal=parseFloat((document.getElementById('stake').value||'').toString().replace(',','.'))||0;
      const possible = totalOdds>0 && stakeVal>0 ? fmtMoney(totalOdds*stakeVal):'—';
      summary.innerHTML=`Zápasů: <span>${currentMatches.length}</span> • Celkový kurz: <span>${totalOdds?fmtOdds(totalOdds):'-'}</span> • Možná výhra: <span>${possible}</span>`;
    }

    function createId(){
      return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    }

    document.getElementById('add-match').addEventListener('click',()=>{
      const home=document.getElementById('home');
      const away=document.getElementById('away');
      const tip=document.getElementById('tip');
      const oddsInput=document.getElementById('odds');

      const h=home.value.trim();
      const a=away.value.trim();
      const t=tip.value.trim();
      const oddsRaw=(oddsInput.value||'').toString().replace(',','.');
      const o=parseFloat(oddsRaw)||0;

      const msg=document.getElementById('message');
      msg.textContent='';
      msg.className='msg';

      if(!h||!a||!t||o<=0){
        msg.textContent='Vyplň domácí, hosty, tip a kurz (větší než 0).';
        msg.classList.add('err');
        return;
      }

      currentMatches.push({
        id:createId(),
        home:h,
        away:a,
        tip:t,
        odds:o,
        status:'pending'
      });

      home.value='';
      away.value='';
      tip.value='';
      oddsInput.value='';
      renderMatches();
    });

    document.getElementById('matches-block').addEventListener('click',(e)=>{
      const btn=e.target.closest('button');
      if(!btn)return;
      if(btn.dataset.action==='delete-match'){
        const id=btn.dataset.id;
        currentMatches=currentMatches.filter(m=>m.id!==id);
        renderMatches();
      }
    });

    document.getElementById('stake').addEventListener('input',()=>{
      renderMatches();
    });

    document.getElementById('save-slip').addEventListener('click',()=>{
      const msg=document.getElementById('message');
      msg.textContent='';
      msg.className='msg';

      if(!currentMatches.length){
        msg.textContent='Tiket nemá žádný zápas.';
        msg.classList.add('err');
        return;
      }
      const dateInput=document.getElementById('date');
      const nameInput=document.getElementById('name');
      const stakeInput=document.getElementById('stake');

      let date=dateInput.value;
      if(!date){
        const d=new Date();
        date=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      }

      const stakeRaw=(stakeInput.value||'').toString().replace(',','.');
      const stake=parseFloat(stakeRaw)||0;

      const deposited = Number(data.wallet && data.wallet.deposited) || 0;

      // ===== TVRDÁ KONTROLA PENĚŽENKY =====
      if (deposited <= 0) {
        msg.textContent = 'Nasrat. Nejdřív si něco vlož v „Statistiky & peněženka“.';
        msg.classList.add('err');
        return;
      }

      if (stake <= 0 || !isFinite(stake)) {
        msg.textContent = 'Zadej platnou výši sázky (větší než 0).';
        msg.classList.add('err');
        return;
      }

      if (stake > deposited) {
        msg.textContent = `Nasrat. Na tuto sázku nemáš dostatečný zůstatek. Max můžeš vsadit ${Math.floor(deposited)} Kč.`;
        msg.classList.add('err');
        return;
      }
      // ===================================

      const slip={
        id:createId(),
        date,
        name:nameInput.value.trim(),
        createdAt:new Date().toISOString(),
        stake:stake<0?0:stake,
        matches:currentMatches
      };

      data.slips.push(slip);
      saveData();

      currentMatches=[];
      renderMatches();
      stakeInput.value='';
      msg.textContent='Tiket uložen. Najdeš ho v „Moje tikety“.';
      msg.classList.add('ok');
    });

    (function init(){
      loadData();
      const d=new Date();
      const today=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      document.getElementById('date').value=today;
      renderMatches();
    })();
  </script>
</body>
</html>
